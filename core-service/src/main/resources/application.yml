server:
  port: 8080

spring:
  application:
    name: flowpulse-core-service

  datasource:
    url: jdbc:postgresql://localhost:5432/flowpulse_db
    username: flowpulse_user
    password: flowpulse_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      # Hibernate must NOT touch schema; Flyway owns it!
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
